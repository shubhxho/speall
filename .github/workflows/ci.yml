name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PageProps and friends are generated, not written — tsc fails on a clean
      # checkout without this, which is exactly what CI caught on its first run.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      # Builds against the committed index, so this also catches a corrupt one.
      - run: npm run build
